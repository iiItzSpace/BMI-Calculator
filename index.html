<h1> Calculadora de IMC </h1>

<div class="formulario">
  <label for="peso">Ingresa tu peso en KILOS</label>
  <input type="number" id="peso" step="0.1" placeholder="Ejemplo: 70.5">
</div>

<div class="formulario">
<label for="altura">Ingresa tu altura en METROS</label>
<input type="number" name="" id="altura" step="0.1" placeholder="Ejemplo: 1.70">
</div>

<button id="btn_calcular">Calcular</button>

<div id="error"></div>
<div id="resultado"></div>
