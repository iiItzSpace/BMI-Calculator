<!doctype html>
<html class="no-js" lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora IMC</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">

  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
</head>

<body>

<h1>Calculadora de IMC</h1>

<div class="form-group">
  <label for="weight">Ingresa tu peso en KILOS</label>
  <input type="number" id="weight" step="0.1" placeholder="Ejemplo: 70.5">
</div>

<div class="form-group">
  <label for="height">Ingresa tu altura en METROS</label>
  <input type="number" id="height" step="0.1" placeholder="Ejemplo: 1.70">
</div>

<button id="btn-calculate">Calcular</button>

<div id="error"></div>
<div id="result"></div>

<script src="js/app.js"></script>

</body>

</html>
